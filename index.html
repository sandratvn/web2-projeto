<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-container">
        <h1><center>Produção</center></h1>
        <form action="#" method="post">
            <div class="form-group">
                <label for="username">Usuário:</label>
                <input type="text" id="username" name="username">
                <span class="hint-text">ex: fulano@google.com</span>
            </div>

            <div class="form-group">
                <label for="password">Senha:</label>
                <input type="password" id="password" name="password">
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="stay-signed-in" name="stay_signed_in">
                <label for="stay-signed-in">Permanecer conectado</label><br>
            
            </div>

            <button type="submit" class="submit-button">Entrar</button><br>
            <a href="logado.html">Entrar</a><br>
            <br>

            <a href="conta.html">Criar conta</a><br>
            <br>
            <a href="resetarsenha.html">Esqueceu ou alterar senha? </a>
            <p></p>
        </form>
    </div>

</body>
</html>
